plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.cishua.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.cishua.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
        vectorDrawables.useSupportLibrary = true
    }

    // 签名文件与口令不入库：本地放置 keystore/cishua.jks，口令用环境变量或 gradle.properties 提供
    def ksPath = System.getenv("CISHUA_KEYSTORE") ?: "${rootDir}/keystore/cishua.jks"
    def ksFile = file(ksPath)
    def hasKey = ksFile.exists()
    signingConfigs {
        if (hasKey) {
            release {
                storeFile ksFile
                storePassword System.getenv("CISHUA_STORE_PASS") ?: (project.findProperty("cishua.storePass") ?: "")
                keyAlias System.getenv("CISHUA_KEY_ALIAS") ?: (project.findProperty("cishua.keyAlias") ?: "cishua")
                keyPassword System.getenv("CISHUA_KEY_PASS") ?: (project.findProperty("cishua.keyPass") ?: "")
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig hasKey ? signingConfigs.release : null
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    packagingOptions {
        resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}']
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation platform('androidx.compose:compose-bom:2024.06.00')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
